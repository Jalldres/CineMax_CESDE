<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax CESDE - Inicio</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
    <!-- Encabezado con Navegación -->
    <header class="navbar navbar-expand-lg shadow p-3 border-bottom border-danger">
        <nav class="container">
            <a href="index.html" class="navbar-brand text-danger fw-bold fs-2 m-0 text-decoration-none">CineMax <span class="text-warning">CESDE</span></a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link text-warning" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="cartelera.html">Cartelera</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="boletos.html">Boletos</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="registro.html">Registro</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <!-- Contenido Principal -->
    <main class="container my-5 shadow-lg rounded p-4 bg-black border border-secondary">        
        <!-- Sección de Registro: Formulario -->
        <section id="registro" class="row justify-content-center">
            <article class="col-md-8 bg-dark p-5 rounded-4 shadow border border-danger">
                <header class="text-center mb-4">
                    <h2 class="text-warning">Registro de Nuevo Usuario</h2>
                    <p class="text-secondary">Únete a CineMax para obtener beneficios exclusivos.</p>
                </header>
                <form action="#" method="POST">
                    <section class="row g-3">
                        <aside class="col-md-6">
                            <label for="reg-nombre" class="form-label">Nombre Completo</label>
                            <input type="text" id="reg-nombre" name="nombre" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Tu nombre" required>
                        </aside>
                        
                        <aside class="col-md-6">
                            <label for="reg-email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="reg-email" name="email" class="form-control bg-black text-white border-secondary focus-danger" placeholder="ejemplo@correo.com" required>
                        </aside>

                        <aside class="col-md-6">
                            <label for="reg-pass" class="form-label">Contraseña</label>
                            <input type="password" id="reg-pass" name="password" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Mínimo 8 caracteres" minlength="8" required>
                        </aside>

                        <aside class="col-md-6">
                            <label for="reg-pass-confirm" class="form-label">Confirmar Contraseña</label>
                            <input type="password" id="reg-pass-confirm" name="password_confirm" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Repite tu contraseña" required>
                        </aside>

                        <aside class="col-12">
                            <label for="intereses" class="form-label">Géneros Favoritos</label>
                            <article class="d-flex flex-wrap gap-3">
                                <article class="form-check">
                                    <input class="form-check-input" type="checkbox" value="accion" id="check-accion">
                                    <label class="form-check-label" for="check-accion">Ciencien Ficcion</label>
                                </article>
                                <article class="form-check">
                                    <input class="form-check-input" type="checkbox" value="drama" id="check-drama">
                                    <label class="form-check-label" for="check-drama">Biografía</label>
                                </article>
                                <article class="form-check">
                                    <input class="form-check-input" type="checkbox" value="comedia" id="check-comedia">
                                    <label class="form-check-label" for="check-comedia">Comedia</label>
                                </article>
                            </article>
                        </aside>

                        <footer class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-danger btn-lg px-5 shadow rounded-pill hover-zoom">Registrarme</button>
                        </footer>
                    </section>
                </form>
            </article>
        </section>
    </main>
    <!-- Pie de Página -->
    <footer class="bg-black text-secondary py-4 text-center border-top border-danger">
        <p class="m-0">&copy; 2026 CineMax CESDE - Proyecto de Introducción a la Programación</p>
        <p class="small text-danger mt-2 fw-light">Andres Felipe Bernal Jaramillo</p>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
