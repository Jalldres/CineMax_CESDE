<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMax CESDE - Inicio</title>
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
    <!-- Encabezado con Navegación -->
    <header class="navbar navbar-expand-lg shadow p-3 border-bottom border-danger">
        <nav class="container">
            <a href="index.html" class="navbar-brand text-danger fw-bold fs-2 m-0 text-decoration-none">CineMax <span class="text-warning">CESDE</span></a>
            <ul class="navbar-nav ms-auto flex-row gap-3">
                <li class="nav-item"><a class="nav-link text-warning" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="cartelera.html">Cartelera</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="boletos.html">Boletos</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="registro.html">Registro</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
    <!-- Contenido Principal -->
    <main class="container my-5 shadow-lg rounded p-4 bg-black border border-secondary">        
        <!-- Sección de Compra: Formulario -->
        <section id="compra" class="row justify-content-center">
            <article class="col-md-8 bg-dark p-5 rounded-4 shadow border border-danger">
                <header class="text-center mb-4">
                    <h2 class="text-warning">Procesar Compra de Boletos</h2>
                    <p class="text-secondary">Completa tus datos para reservar tu lugar.</p>
                </header>
                <form action="#" method="POST">
                    <section class="row g-3">
                        <aside class="col-md-6">
                            <label for="nombre" class="form-label">Nombre del Cliente</label>
                            <input type="text" id="nombre" name="nombre" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Ej: Juan Pérez" required>
                        </aside>
                        <aside class="col-md-6">
                            <label for="pelicula" class="form-label">Título de la Película</label>
                            <select id="pelicula" name="pelicula" class="form-select bg-black text-white border-secondary focus-danger" required>
                                <option value="" selected disabled>Selecciona una película</option>
                                <option>El Mandaloria y Grogu</option>
                                <option>Michael</option>
                                <option>El Diablo Viste a la Moda</option>
                            </select>
                        </aside>
                        <aside class="col-md-6">
                            <label for="tickets" class="form-label">Cantidad de Tickets</label>
                            <input type="number" id="tickets" name="tickets" min="1" max="10" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Máx 10" required>
                        </aside>

                        <aside class="col-md-6">
                            <label for="edad" class="form-label">Edad del Comprador</label>
                            <input type="number" id="edad" name="edad" min="5" class="form-control bg-black text-white border-secondary focus-danger" placeholder="Mínimo 5 años" required>
                        </aside>
                        <footer class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-danger btn-lg px-5 shadow rounded-pill hover-zoom">Procesar Compra</button>
                        </footer>
                    </section>
                </form>
            </article>
        </section>
    </main>
    <!-- Pie de Página -->
    <footer class="bg-black text-secondary py-4 text-center border-top border-danger">
        <p class="m-0">&copy; 2026 CineMax CESDE - Proyecto de Introducción a la Programación</p>
        <p class="small text-danger mt-2 fw-light">Andres Felipe Bernal Jaramillo</p>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
